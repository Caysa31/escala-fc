workflows:

  # ── Android ─────────────────────────────────────────────────────────────────
  android-release:
    name: Android Release (Google Play)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - android_signing
      vars:
        KEYSTORE_PATH: /tmp/cobra-bola.keystore
      node: 22.13.0
      java: 21

    scripts:
      - name: Instalar dependências
        script: |
          npm install

      - name: Instalar e verificar pacotes Capacitor
        script: |
          npm install @capacitor/core@8.4.0 @capacitor/cli@8.4.0 @capacitor/android@8.4.0 @capacitor/ios@8.4.0 @capacitor/splash-screen@8.0.1 @capacitor/status-bar@8.0.2
          echo "=== @capacitor packages instalados ==="
          ls node_modules/@capacitor/
          echo "=== @capacitor/android subdirs ==="
          ls node_modules/@capacitor/android/
          echo "=== @capacitor/android/capacitor (deve ter build.gradle) ==="
          ls node_modules/@capacitor/android/capacitor/
          echo "=== @capacitor/splash-screen/android (deve ter build.gradle) ==="
          ls node_modules/@capacitor/splash-screen/android/
          echo "=== @capacitor/status-bar/android (deve ter build.gradle) ==="
          ls node_modules/@capacitor/status-bar/android/

      - name: Criar arquivos de config Capacitor (cap sync manual)
        script: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/xml
          mkdir -p out

          # capacitor.config.json → lido pelo app em runtime
          cat > android/app/src/main/assets/capacitor.config.json << 'EOF'
          {
            "appId": "com.cobradabola.app",
            "appName": "Cobra da Bola",
            "webDir": "public",
            "server": {
              "url": "https://cobra-craque.vercel.app",
              "cleartext": false
            }
          }
          EOF

          # capacitor.plugins.json → registro de plugins nativos
          cat > android/app/src/main/assets/capacitor.plugins.json << 'EOF'
          {
            "ios": [],
            "android": [
              {
                "pkg": "@capacitor/splash-screen",
                "classpath": "com.capacitorjs.plugins.splashscreen.SplashScreenPlugin"
              },
              {
                "pkg": "@capacitor/status-bar",
                "classpath": "com.capacitorjs.plugins.statusbar.StatusBarPlugin"
              }
            ]
          }
          EOF

          # Tenta cap sync para gerar config.xml e demais arquivos
          npx cap sync android 2>&1 || echo "cap sync falhou, continuando com config manual..."

          echo "=== Assets gerados ==="
          ls android/app/src/main/assets/

      - name: Decodificar keystore
        script: |
          # Decodifica base64 via Python (mais robusto que base64/openssl no macOS)
          python3 -c "import base64,os,sys; d=os.environ.get('KEYSTORE_BASE64',''); b=base64.b64decode(d) if d else b''; open('$KEYSTORE_PATH','wb').write(b); print('Keystore:',len(b),'bytes'); print('Hex:',b[:8].hex()) if b else print('ERRO: KEYSTORE_BASE64 vazio')"

          echo "=== Diagnóstico keystore ==="
          echo "KEY_ALIAS=[${KEY_ALIAS}]"
          echo "Tamanho do arquivo: $(wc -c < $KEYSTORE_PATH) bytes"
          echo "Primeiros bytes (hex): $(xxd $KEYSTORE_PATH | head -2)"
          keytool -list -keystore $KEYSTORE_PATH -storepass "$KEYSTORE_PASSWORD" -storetype JKS 2>&1 | head -15

      - name: Build Android (.aab)
        script: |
          cd android
          chmod +x gradlew
          echo "=== Verificando estrutura Gradle antes do build ==="
          ls ../node_modules/@capacitor/android/capacitor/
          ls ../node_modules/@capacitor/splash-screen/android/
          ls ../node_modules/@capacitor/status-bar/android/
          echo "=== Iniciando bundleRelease ==="
          echo "KEY_ALIAS=[${KEY_ALIAS}]"
          ./gradlew bundleRelease --stacktrace

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab

    # publishing para Google Play — ativar depois de criar a conta
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true


  # ── iOS ─────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      groups:
        - app_store_connect
      node: 22.13.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.cobradabola.app

    scripts:
      - name: Instalar dependências
        script: npm ci

      - name: Sincronizar iOS (SPM)
        script: |
          npm install @capacitor/core@8.4.0 @capacitor/cli@8.4.0 @capacitor/ios@8.4.0 @capacitor/splash-screen@8.0.1 @capacitor/status-bar@8.0.2
          mkdir -p out
          npx cap sync ios
          echo "=== Estrutura ios/App ==="
          ls ios/App/

      - name: Diagnóstico Apple Developer
        script: |
          echo "=== Bundle IDs registrados na conta ==="
          app-store-connect bundle-ids list 2>&1 || echo "ERRO ao listar bundle IDs"

          echo "=== Certificados IOS_DISTRIBUTION ==="
          app-store-connect certificates list --type IOS_DISTRIBUTION 2>&1 || echo "ERRO"

          echo "=== Perfis IOS_APP_STORE ==="
          app-store-connect profiles list --type IOS_APP_STORE 2>&1 || echo "ERRO"

          echo "=== Estrutura ios/App ==="
          ls -la ios/App/

      - name: Configurar assinatura iOS
        script: |
          set -e
          keychain initialize

          echo "=== Deletando provisioning profiles IOS_APP_STORE ==="
          PROFILE_IDS=$(app-store-connect profiles list \
              --type IOS_APP_STORE --json 2>/dev/null \
            | python3 -c "
          import sys, json
          try:
              for p in json.load(sys.stdin): print(p.get('id',''))
          except: pass
          " 2>/dev/null || true)
          for ID in $PROFILE_IDS; do
            if [ -n "$ID" ]; then
              echo "Deletando profile: $ID"
              app-store-connect profiles delete "$ID" 2>&1 || true
            fi
          done

          echo "=== Revogando certificados de distribuição (todos os tipos) ==="
          for CERT_TYPE in IOS_DISTRIBUTION APPLE_DISTRIBUTION; do
            CERT_IDS=$(app-store-connect certificates list \
                --type "$CERT_TYPE" --json 2>/dev/null \
              | python3 -c "
          import sys, json
          try:
              for c in json.load(sys.stdin): print(c.get('id',''))
          except: pass
          " 2>/dev/null || true)
            for ID in $CERT_IDS; do
              if [ -n "$ID" ]; then
                echo "Revogando $CERT_TYPE: $ID"
                app-store-connect certificates revoke "$ID" 2>&1 || true
              fi
            done
          done

          echo "=== STEP 1: Gerar chave privada RSA ==="
          openssl genrsa -out /tmp/distribution.key 2048
          echo "Chave gerada: $(wc -c < /tmp/distribution.key) bytes"

          echo "=== STEP 2: Criar certificado + perfil com a chave ==="
          app-store-connect fetch-signing-files \
              "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key "$(cat /tmp/distribution.key)" \
              --create

          echo "=== .p12 salvo ==="
          ls -la ~/Library/MobileDevice/Certificates/ 2>/dev/null || echo "VAZIO"

          echo "=== Profiles salvos ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "VAZIO"

          echo "=== STEP 3: Adicionar ao keychain ==="
          keychain add-certificates

          echo "=== Identidades no keychain ==="
          security find-identity -v -p codesigning 2>&1 || true

      - name: Incrementar build number
        script: |
          # CFBundleVersion = número sequencial do Codemagic (sempre cresce)
          PLIST="ios/App/App/Info.plist"
          echo "Build number: $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          echo "CFBundleVersion agora: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' $PLIST)"

      - name: Build iOS (.ipa)
        script: |
          echo "=== workspace/project disponíveis ==="
          ls ios/App/*.xcworkspace 2>/dev/null && echo "WORKSPACE encontrado" || echo "Sem workspace"
          ls ios/App/*.xcodeproj  2>/dev/null && echo "PROJECT encontrado"  || echo "Sem project"

          xcode-project use-profiles

          echo "=== Signing settings após use-profiles ==="
          grep -E 'PROVISIONING_PROFILE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM' \
            ios/App/App.xcodeproj/project.pbxproj 2>/dev/null | sort -u | head -20 || true

          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
